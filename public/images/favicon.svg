<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Qimta icon mark: rounded-square frame + Saudi riyal glyph, brand green. -->
  <rect x="7" y="7" width="86" height="86" rx="18"
        fill="none" stroke="#1a7a36" stroke-width="8"/>
  <g stroke="#1a7a36" stroke-width="7.5" stroke-linecap="butt">
    <!-- two vertical strokes -->
    <line x1="38" y1="26" x2="38" y2="72"/>
    <line x1="58" y1="26" x2="58" y2="72"/>
    <!-- crossbars -->
    <line x1="34" y1="47" x2="74" y2="47"/>
    <line x1="34" y1="61" x2="74" y2="61"/>
    <!-- lower angled tail -->
    <line x1="52" y1="73" x2="74" y2="69"/>
  </g>
</svg>
